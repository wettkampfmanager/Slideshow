<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slideshow Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    .layer { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain;
             opacity: 0; transition-property: opacity; transition-timing-function: ease-in-out; }
    .layer.visible { opacity: 1; }
    #setup { position: fixed; inset: 0; display: none; place-items: center; text-align: center;
             color: #888; font: 2.2vw/1.5 system-ui, sans-serif; padding: 5vw; }
    #setup strong { color: #ddd; }
    #status { position: fixed; right: 8px; bottom: 6px; color: #555; font: 12px sans-serif; display: none; }
  </style>
</head>
<body>
  <img class="layer" id="layer-a" alt="">
  <img class="layer" id="layer-b" alt="">
  <div id="setup"><div><strong>Slideshow ist noch nicht eingerichtet</strong><br>
    Bilder und Zeiträume anlegen unter<br><strong id="admin-url" data-hostname="{{ hostname }}"></strong></div></div>
  <div id="status">Server nicht erreichbar, zeige letzte Playlist</div>
  <script src="/static/player.js"></script>
</body>
</html>
